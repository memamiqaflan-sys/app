name: Build POCO Android APK
on:
  workflow_dispatch:
  push:
    branches: ['codex/poco-x3-android']
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore app signing identity
        env:
          KEYSTORE_B64: ${{ secrets.POCO_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/poco-recorder.jks"
          chmod 600 "$RUNNER_TEMP/poco-recorder.jks"
      - name: Build, test and lint Android app
        working-directory: android
        env:
          POCO_SIGNING_STORE: ${{ runner.temp }}/poco-recorder.jks
          POCO_SIGNING_PASSWORD: ${{ secrets.POCO_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build.log
          python3 -m unittest discover -s tests -v
      - name: Verify installable signed APK
        working-directory: android
        run: |
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SDK_TOOLS" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PocoRecorder.apk
          sha256sum PocoRecorder.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PocoRecorder-APK
          path: |
            android/PocoRecorder.apk
            android/SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-report
          path: |
            android/build.log
            android/app/build/reports/
          retention-days: 14
